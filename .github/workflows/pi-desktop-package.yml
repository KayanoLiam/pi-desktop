name: pi-desktop-package

# Build test installers from this fork's default branch. This does not sign,
# notarize, publish a release, or update the production updater feed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: x64
            runner: macos-15
          - platform: windows
            arch: x64
            runner: windows-2022
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux Tauri bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf rpm libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      # Bun's cross-compile runtime extraction for the two bundled Linux SSH
      # helpers fails on Windows. Seed its cache from the version-matched
      # official release ZIPs instead; never run a downloaded executable.
      - name: Seed Bun Linux runtimes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (bun --version).Trim()
          $cache = Join-Path $env:RUNNER_TEMP 'bun-install-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          foreach ($target in @('linux-x64-baseline', 'linux-aarch64')) {
            $archive = Join-Path $env:RUNNER_TEMP "bun-$target.zip"
            $unpacked = Join-Path $env:RUNNER_TEMP "bun-$target-unpacked"
            $url = "https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-$target.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
            $source = Join-Path $unpacked "bun-$target/bun"
            if (-not (Test-Path $source)) { throw "Missing Bun runtime in $archive" }
            $destination = Join-Path $cache "bun-$target-v$version"
            Copy-Item -LiteralPath $source -Destination $destination
            $bytes = [System.IO.File]::ReadAllBytes($destination)
            if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x7f -or $bytes[1] -ne 0x45 -or $bytes[2] -ne 0x4c -or $bytes[3] -ne 0x46) {
              throw "Invalid ELF runtime: $destination"
            }
          }
          "BUN_INSTALL_CACHE_DIR=$cache" >> $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Package macOS (ad-hoc signed, not notarized)
        if: runner.os == 'macOS'
        working-directory: apps/examples/desktop-app
        run: bun run package:desktop:mac --allow-unsigned-mac

      - name: Package Windows or Linux
        if: runner.os != 'macOS'
        working-directory: apps/examples/desktop-app
        run: bun run package:desktop:${{ matrix.platform }}

      - name: Verify installers
        shell: bash
        run: |
          set -euo pipefail
          root=apps/examples/desktop-app/dist/desktop
          ls -lah "$root"
          case '${{ matrix.platform }}' in
            mac) test -n "$(find "$root" -maxdepth 1 -name '*.dmg' -print -quit)" ;;
            windows) test -n "$(find "$root" -maxdepth 1 \( -name '*.msi' -o -name '*.exe' \) -print -quit)" ;;
            linux) test -n "$(find "$root" -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print -quit)" ;;
          esac

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.platform }}-${{ matrix.arch }}-test
          path: apps/examples/desktop-app/dist/desktop/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
